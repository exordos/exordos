name: tests

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.markdownlint.yaml'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.markdownlint.yaml'
      - '*.md'

jobs:
  Lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: ruff
        run: |
          tox -e ruff-check
  Installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: Shell lint and installer tests
        run: tox -e installer
  Tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: Unit tests
        run: |
          tox -e ${{ matrix.python-version }}
  Coverage:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: Coverage
        run: |
          tox -e begin,${{ matrix.python-version }},${{ matrix.python-version }}-functional,end
  Ascii:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - name: check ascii
        run: |
          ! grep -rnPq "#.*[^\\x00-\\x7f]" ./exordos
  MinIO:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build test MinIO image
        run: docker build -t exordos-test-minio -f etc/tests/minio/Dockerfile .
      - name: Generate test credentials
        run: |
          access_key=$(openssl rand -hex 10)
          secret_key=$(openssl rand -hex 24)
          echo "::add-mask::$access_key"
          echo "::add-mask::$secret_key"
          printf 'MINIO_ROOT_USER=%s\n' "$access_key" >> "$GITHUB_ENV"
          printf 'MINIO_ROOT_PASSWORD=%s\n' "$secret_key" >> "$GITHUB_ENV"
      - name: Start MinIO
        run: |
          docker run --detach --name exordos-test-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER \
            --env MINIO_ROOT_PASSWORD \
            exordos-test-minio
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' exordos-test-minio)" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs exordos-test-minio
          exit 1
      - name: Test S3 upload
        run: |
          docker exec exordos-test-minio mkdir /data/backups
          python -m pip install requests
          python - <<'PY'
          import io
          import os

          from exordos.backup.s3_client import S3BackupClient

          payload = b"exordos MinIO test"
          client = S3BackupClient(
              endpoint_url="http://127.0.0.1:9000",
              access_key=os.environ["MINIO_ROOT_USER"],
              secret_key=os.environ["MINIO_ROOT_PASSWORD"],
              region="us-east-1",
          )
          client.upload(io.BytesIO(payload), "backups", "test/backup", len(payload))
          PY
