name: Upload and update on self-hosted

on: workflow_dispatch

env:
  REPO_ENDPOINT_PUT: http://10.20.0.1:8082

jobs:
  upload-install-sh:
    name: Upload install.sh
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Push artifacts to repository
      run: curl -X PUT --upload-file ./etc/install.sh $REPO_ENDPOINT_PUT/install.sh

  update-exordos-cli:
    name: update exordos cli
    needs: upload-install-sh
    runs-on: self-hosted
    steps:
    - name: update exordos cli
      run: |
        set -eux

        mkdir -p "$HOME/bin"
        curl --fail --show-error --location --progress-bar https://repository.genesis-core.tech/exordos/latest/exordos-linux --output "$HOME/bin/exordos"
        chmod +x "$HOME/bin/exordos"
        
        source ~/.profile
        which exordos
        exordos version
 
