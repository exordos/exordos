name: Upload and update on self-hosted

on: workflow_dispatch

env:
  REPO_ENDPOINT_PUT: http://10.20.0.1:8082

jobs:
  upload-install-sh:
    name: Upload install.sh
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Push artifacts to repository
      run: |
        set -eu
        VERSION=$(curl -fsSL https://repo.exordos.com/exordos/latest/VERSION)
        for ARCH in x86_64 aarch64; do
          ARTIFACT="exordos-linux-$ARCH.tar.xz"
          for FILE in "$ARTIFACT" "$ARTIFACT.sha256"; do
            curl --fail --show-error --silent --head \
              "https://repo.exordos.com/exordos/$VERSION/$FILE" >/dev/null
          done
        done
        curl --fail --show-error --silent -X PUT --upload-file ./etc/install.sh "$REPO_ENDPOINT_PUT/install.sh"

  update-exordos-cli:
    name: update exordos cli
    needs: upload-install-sh
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ github-packer-runner-0, github-packer-runner-1, github-packer-runner-2, github-packer-runner-3, runner-4 ]
    steps:
    - name: update exordos cli
      run: |
        set -eu
        INSTALLER=$(mktemp)
        trap 'rm -f "$INSTALLER"' EXIT
        curl --fail --show-error --location https://repo.exordos.com/install.sh --output "$INSTALLER"
        sudo env EXORDOS_INSTALL_PREFIX=/usr/local sh "$INSTALLER"
        exordos --no-check-updates version
 
