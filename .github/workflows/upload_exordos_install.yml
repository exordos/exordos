name: Upload and update on self-hosted

on: workflow_dispatch

env:
  REPO_ENDPOINT_PUT: http://10.20.0.1:8082

jobs:
  upload-install-sh:
    name: Upload install.sh
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Push artifacts to repository
      run: curl -X PUT --upload-file ./etc/install.sh $REPO_ENDPOINT_PUT/install.sh

  update-exordos-cli:
    name: update exordos cli
    needs: upload-install-sh
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ github-packer-runner-1, github-packer-runner-2, github-packer-runner-3, genesis-lab0 ]
    steps:
    - name: update exordos cli
      run: |
        set -eux

        curl --fail --show-error --location --progress-bar https://repository.genesis-core.tech/exordos/latest/exordos-linux --output /usr/local/bin/exordos
        chmod +x /usr/local/bin/exordos
        
        exordos version
 
